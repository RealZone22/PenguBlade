name: Fix PHP code style issues

on:
  push:
    paths:
      - '**.php'
  workflow_dispatch:

jobs:
  php-code-styling:
    name: php-code-styling
    runs-on: docker
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fix PHP code style issues
        uses: https://github.com/aglipanci/laravel-pint-action@2.6

      - name: Commit changes
        uses: https://github.com/stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Fix styling
          branch: ${{ forgejo.ref_name }}
